<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Side panel — Flows</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*,*::before,*::after{box-sizing:border-box}
a{color:#2563eb}a:hover{color:#1d4ed8}
</style>
</helmet>
<div id="my-ext" data-theme="hpma-light" style="width: 360px; height: 1180px; display: flex; flex-direction: column; overflow: hidden; background: #f8f7fa; font-family: Montserrat, -apple-system, 'Segoe UI', sans-serif; color: #52525b; font-size: 14px; line-height: 20px;">

  <header style="flex-shrink: 0; background: #ffffff; border-bottom: 1px solid rgba(47, 43, 61, 0.12);">
    <div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px 16px;">
      <span style="width: 32px; height: 32px; border-radius: 6px; background: #f3f4f6; color: #4b5563; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l18 0"></path><path d="M9 8l1 0"></path><path d="M9 12l1 0"></path><path d="M9 16l1 0"></path><path d="M14 8l1 0"></path><path d="M14 12l1 0"></path><path d="M14 16l1 0"></path><path d="M5 21v-16a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v16"></path></svg>
      </span>
      <button type="button" aria-label="Chọn tab BM đang bám, có 3 tab BM đang mở" style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; padding: 2px 6px; margin-left: -6px; border: 0; border-radius: 6px; background: transparent; font-family: inherit; text-align: left; cursor: pointer;">
        <span style="display: flex; align-items: center; gap: 6px; max-width: 100%;">
          <span style="font-size: 14px; line-height: 20px; font-weight: 600; color: #2f2b3d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Tenomad Agency 03</span>
          <span style="font-size: 11px; line-height: 16px; padding: 0 5px; border-radius: 4px; background: #f3f4f6; color: #4b5563; white-space: nowrap;">1/3 tab</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M6 9l6 6l6 -6"></path></svg>
        </span>
        <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; color: #4b5563;">
          <span style="width: 6px; height: 6px; border-radius: 50%; background: #22c55e; flex-shrink: 0;"></span>
          Đang bám · Partners
          <span style="display: inline-flex; align-items: center; gap: 2px; color: #15803d; font-weight: 500;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5l10 -10"></path></svg>hỗ trợ</span>
        </span>
      </button>
      <button type="button" aria-label="Ngôn ngữ: Tiếng Việt. Bấm để đổi sang English" style="height: 36px; min-width: 40px; padding: 0 8px; border-radius: 6px; border: 1px solid rgba(47, 43, 61, 0.22); background: #ffffff; color: #2f2b3d; font-family: inherit; font-size: 12px; font-weight: 600; flex-shrink: 0;">VI</button>
    </div>
    <div style="padding: 4px 16px 10px;">
      <div role="group" aria-label="Mode lần chạy" style="display: flex; gap: 4px; padding: 3px; border-radius: 8px; background: #f3f4f6;">
        <sc-for list="{{modes}}" as="o" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{o.pressed}}" disabled="{{o.locked}}" style="flex: 1; height: 36px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 6px; font-family: inherit; font-size: 13px; font-weight: {{o.weight}}; background: {{o.bg}}; color: {{o.fg}}; border: 1px solid {{o.border}};">
            <sc-if value="{{o.isDry}}" hint-placeholder-val="{{false}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 12a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"></path><path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6"></path></svg></sc-if>
            <sc-if value="{{o.isAssist}}" hint-placeholder-val="{{false}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13v-8.5a1.5 1.5 0 0 1 3 0v7.5"></path><path d="M11 11.5v-2a1.5 1.5 0 1 1 3 0v2.5"></path><path d="M14 10.5a1.5 1.5 0 0 1 3 0v1.5"></path><path d="M17 11.5a1.5 1.5 0 0 1 3 0v4.5a6 6 0 0 1 -6 6h-2h.208a6 6 0 0 1 -5.012 -2.7l-.196 -.3c-.312 -.479 -1.407 -2.388 -3.286 -5.728a1.5 1.5 0 0 1 .536 -2.022a1.867 1.867 0 0 1 2.28 .28l1.47 1.47"></path></svg></sc-if>
            <sc-if value="{{o.isFull}}" hint-placeholder-val="{{false}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3l0 7l6 0l-8 11l0 -7l-6 0l8 -11"></path></svg></sc-if>
            <sc-if value="{{o.locked}}" hint-placeholder-val="{{false}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6z"></path><path d="M8 11v-4a4 4 0 1 1 8 0v4"></path></svg></sc-if>
            {{o.label}}
          </button>
        </sc-for>
      </div>
    </div>
    <nav aria-label="Màn hình" style="display: flex; padding: 0 8px; border-top: 1px solid rgba(47, 43, 61, 0.12);">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
        <a href="{{t.href}}" aria-current="{{t.current}}" style="flex: 1; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: {{t.weight}}; color: {{t.fg}}; text-decoration: none; border-bottom: 2px solid {{t.line}};">{{t.label}}</a>
      </sc-for>
    </nav>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 18px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px;">
      <h1 style="margin: 0; font-size: 18px; line-height: 28px; font-weight: 500; color: #2f2b3d;">Flows</h1>
      <span style="font-size: 12px; line-height: 16px; color: #4b5563;">Xếp theo rủi ro tăng dần</span>
    </div>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: {{g.dot}};"></span>
          <h2 style="margin: 0; font-size: 12px; line-height: 14px; letter-spacing: 0.05rem; text-transform: uppercase; font-weight: 500; color: #4b5563;">{{g.title}}</h2>
          <span style="font-size: 12px; line-height: 14px; color: #4b5563;">· {{g.count}}</span>
        </div>
        <sc-for list="{{g.flows}}" as="f" hint-placeholder-count="3">
          <a href="{{f.href}}" style="display: flex; gap: 10px; align-items: flex-start; padding: 12px; background: #ffffff; border: 1px solid rgba(47, 43, 61, 0.12); border-radius: 6px; text-decoration: none; color: inherit;">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
              <span style="font-size: 14px; line-height: 20px; font-weight: 600; color: #2f2b3d;">{{f.name}}</span>
              <span style="font-size: 13px; line-height: 18px; color: #4b5563;">{{f.desc}}</span>
              <span style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;">
                <span style="display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-radius: 6px; font-size: 12px; font-weight: 500; background: {{g.bg}}; border: 1px solid {{g.border}}; color: {{g.fg}};">
                  <sc-if value="{{g.isRead}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 12a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"></path><path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6"></path></svg></sc-if>
                  <sc-if value="{{g.isWrite}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5l10 -10"></path></svg></sc-if>
                  <sc-if value="{{g.isSensitive}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a12 12 0 0 0 8.5 3a12 12 0 0 1 -8.5 15a12 12 0 0 1 -8.5 -15a12 12 0 0 0 8.5 -3"></path></svg></sc-if>
                  {{g.tier}}
                </span>
                <sc-if value="{{f.locked}}" hint-placeholder-val="{{false}}">
                  <span style="display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-radius: 6px; font-size: 12px; font-weight: 500; background: #f3f4f6; border: 1px solid #e5e7eb; color: #4b5563;">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6z"></path><path d="M8 11v-4a4 4 0 1 1 8 0v4"></path></svg>
                    Chưa mở write
                  </span>
                </sc-if>
              </span>
            </span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px;"><path d="M9 6l6 6l-6 6"></path></svg>
          </a>
        </sc-for>
      </section>
    </sc-for>
  </main>

  <footer style="flex-shrink: 0; height: 54px; background: #ffffff; border-top: 1px solid rgba(47, 43, 61, 0.12); display: flex; align-items: center; gap: 12px; padding: 0 12px 0 16px;">
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
      <div style="font-size: 12px; line-height: 16px; color: #4b5563; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Ghi hôm nay <span style="font-weight: 600; color: #2f2b3d;">3/20</span> · Curfew 0h–6h</div>
      <div style="height: 4px; border-radius: 9999px; background: #f1f0f2; overflow: hidden;"><div style="width: 15%; height: 4px; background: #6b7280;"></div></div>
    </div>
    <button type="button" style="height: 36px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border: 0; border-radius: 6px; background: #b91c1c; color: #ffffff; font-family: inherit; font-size: 13px; font-weight: 600; flex-shrink: 0;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
      Kill-switch
    </button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    const MODE = 'dry';
    const FULL_LOCKED = true;
    const TAB = 'flows';
    const SEL = {
      dry: { bg: '#f0fdf4', fg: '#15803d', border: '#86efac' },
      assist: { bg: '#fefce8', fg: '#854d0e', border: '#fde047' },
      full: { bg: '#fff7ed', fg: '#c2410c', border: '#fdba74' }
    };
    const modes = ['dry', 'assist', 'full'].map((m) => {
      const on = m === MODE;
      const locked = m === 'full' && FULL_LOCKED;
      return {
        label: m === 'dry' ? 'Dry-run' : m === 'assist' ? 'Assist' : 'Full',
        isDry: m === 'dry', isAssist: m === 'assist', isFull: m === 'full' && !locked, locked: locked,
        pressed: on ? 'true' : 'false',
        bg: on ? SEL[m].bg : 'transparent',
        fg: locked ? '#9ca3af' : on ? SEL[m].fg : '#4b5563',
        border: on ? SEL[m].border : 'transparent',
        weight: on ? 600 : 500
      };
    });
    const tabs = [['flows', 'Flows', 'Flows.dc.html'], ['run', 'Run', 'RunDryRun.dc.html'], ['log', 'Log', 'Log.dc.html'], ['probe', 'Probe', 'Probe.dc.html']].map((t) => ({
      label: t[1], href: t[2], current: t[0] === TAB ? 'page' : 'false',
      weight: t[0] === TAB ? 600 : 500, fg: t[0] === TAB ? '#2563eb' : '#4b5563', line: t[0] === TAB ? '#3b82f6' : 'transparent'
    }));

    const groups = [
      {
        title: 'Đọc', count: 3, dot: '#22c55e', tier: 'Không cần duyệt', isRead: true, isWrite: false, isSensitive: false,
        bg: '#f0fdf4', border: '#bbf7d0', fg: '#15803d',
        flows: [
          { name: 'Kiểm kê tài sản', desc: 'Liệt kê TKQC, pixel, người dùng trong BM', href: '#', locked: false },
          { name: 'Chất lượng TKQC', desc: 'Trạng thái, giới hạn chi tiêu, lý do bị hạn chế', href: '#', locked: false },
          { name: 'Báo cáo 2FA', desc: 'Ai trong BM chưa bật xác thực 2 lớp', href: '#', locked: false }
        ]
      },
      {
        title: 'Ghi thường', count: 1, dot: '#eab308', tier: 'Duyệt 1 lớp', isRead: false, isWrite: true, isSensitive: false,
        bg: '#fefce8', border: '#fde68a', fg: '#854d0e',
        flows: [
          { name: 'Đổi tên TKQC', desc: 'Đổi tên hàng loạt theo mẫu đặt tên', href: '#', locked: false }
        ]
      },
      {
        title: 'Ghi nhạy cảm', count: 4, dot: '#f97316', tier: 'Duyệt 2 lớp', isRead: false, isWrite: false, isSensitive: true,
        bg: '#fff7ed', border: '#fed7aa', fg: '#c2410c',
        flows: [
          { name: 'Gán partner vào TKQC', desc: 'Cấp quyền TKQC cho BM đối tác', href: 'FlowConfig.dc.html', locked: false },
          { name: 'Gỡ partner', desc: 'Thu hồi quyền của BM đối tác trên TKQC', href: '#', locked: true },
          { name: 'Share pixel / dataset', desc: 'Chia sẻ pixel cho BM đối tác', href: '#', locked: true },
          { name: 'Quản lý người dùng BM', desc: 'Mời, đổi vai trò, xoá người dùng', href: '#', locked: true }
        ]
      }
    ];
    return { modes: modes, tabs: tabs, groups: groups };
  }
}
</script>
</body>
</html>
